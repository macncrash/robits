# KBM-17H02-C00: Kollmorgen KBM frameless brushless motor, frame 17. Values as printed in the catalog.
id = "kollmorgen-kbm-17h02-c"
category = "frameless-motors"
maker = "Kollmorgen"
country = "US"
model = "KBM-17H02-C00"
notes = "Frameless: no flange on frame 17. Stator bonds into a housing cup with a depth-stop shoulder (0.05-0.10 mm slip fit per side, adhesive grooves over 50%+ of the bore, 2 mm min to the end turns; Scotchweld 2214 or Hysol EA934NA), or an axial clamp ring if it must come out (catalog pp. 90-93). Rotor bonds or lock-nuts against a shaft shoulder; optional 8 x M3 tapped holes on a 23.5 mm circle (p. 95). End-turn OD and stator bore are not in the catalog: take them from the 3D model at kollmorgen.com/kbm. KBMS (Hall) variants have longer rotors."

